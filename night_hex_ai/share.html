<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared conversation · NIGHT HEX AI</title><link rel="stylesheet" href="/style.css"></head><body class="share-page"><main class="share-shell"><header class="admin-head"><a class="brand" href="/"><img class="brand-mark" src="/assets/night-hex-logo.webp" alt=""><span>NIGHT HEX <small>AI</small></span></a><a class="back-link" href="/">Open NIGHT HEX AI</a></header><h1 id="shareTitle">Shared conversation</h1><p class="muted">Read-only shared conversation</p><div id="sharedMessages" class="shared-messages">Loading conversation…</div></main><script>
(async()=>{const token=location.pathname.split('/').pop();const box=document.getElementById('sharedMessages');try{const r=await fetch('/api/share?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load');document.getElementById('shareTitle').textContent=d.chat?.title||'Shared conversation';box.replaceChildren();(d.messages||[]).forEach(m=>{const el=document.createElement('article');el.className='shared-message '+m.role;const h=document.createElement('strong');h.textContent=m.role==='assistant'?'NIGHT HEX AI':'User';const p=document.createElement('p');p.textContent=m.content;el.append(h,p);box.append(el)});}catch(e){box.textContent=e.message}})();
</script></body></html>
