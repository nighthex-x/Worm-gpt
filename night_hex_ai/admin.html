<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>NIGHT HEX AI · Admin</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-page nh-admin-v2"><main class="admin-shell">
<header class="admin-head"><a class="brand" href="/"><img class="brand-mark" src="/assets/night-hex-logo.webp" alt="NIGHT HEX"><span>NIGHT HEX <small>CONTROL</small></span></a><div class="admin-head-actions"><button id="adminTheme" class="secondary-btn" type="button">Theme</button><a class="back-link" href="/">← AI Chat</a></div></header>
<section class="admin-intro"><div class="eyebrow">PRIVATE CONTROL CENTER</div><h1>Admin Dashboard</h1><p class="muted">Compact controls · Separate panels · Mobile ready</p></section>
<section class="admin-login" id="loginPanel"><form id="adminLogin"><label for="adminEmail">Admin email</label><input id="adminEmail" type="email" required autocomplete="username"><label for="adminPassword">Password</label><input id="adminPassword" type="password" required autocomplete="current-password"><button class="primary-btn" id="adminSubmit">Secure sign in</button></form><p class="fineprint">Administrator access is verified on the server.</p></section>
<section id="dashboard" class="hidden"><div class="dashboard-toolbar"><div id="notice" class="notice">Verifying…</div><button id="refreshAdmin" class="secondary-btn compact-btn" type="button">↻</button></div>
<div id="stats" class="admin-stats"></div>
<div class="nh-tiles">
<button class="nh-tile" data-modal="usersModal"><span class="nh-tile-icon">♙</span><strong>User Management</strong><small id="tileUsers">Loading users…</small></button>
<button class="nh-tile" data-modal="maintenanceModal"><span class="nh-tile-icon">◷</span><strong>Maintenance</strong><small id="tileMaintenance">Checking status…</small></button>
<button class="nh-tile" data-modal="announcementModal"><span class="nh-tile-icon">▤</span><strong>Announcements</strong><small id="tileAnnouncements">Manage notices</small></button>
<button class="nh-tile" data-modal="analyticsModal"><span class="nh-tile-icon">▥</span><strong>Analytics</strong><small>Usage overview</small></button>
<button class="nh-tile" data-modal="systemModal"><span class="nh-tile-icon">⌁</span><strong>System Health</strong><small id="tileHealth">Checking server…</small></button>
<button class="nh-tile" data-modal="securityModal"><span class="nh-tile-icon">⬡</span><strong>Security</strong><small>Admin session & controls</small></button>
</div>
<div class="admin-footer"><span class="muted small">NIGHT HEX AI · CONTROL CENTER</span><button class="secondary-btn admin-signout" id="adminSignOut" type="button">Sign out</button></div></section>
</main>
<div class="nh-modal-backdrop hidden" id="modalBackdrop"><section class="nh-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="nh-modal-head"><div><div class="eyebrow">NIGHT HEX CONTROL</div><h2 id="modalTitle">Panel</h2></div><button class="nh-close" id="modalClose" type="button" aria-label="Close">×</button></header><div class="nh-modal-body" id="modalBody"></div></section></div>
<div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
